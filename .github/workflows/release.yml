name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and attach to release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Build BreakTime.app (universal: arm64 + x86_64)"
        env:
          APP_VERSION: ${{ github.ref_name }} # "v" prefix is stripped in make-app.sh
        run: ./make-app.sh release universal

      - name: Verify universal binary
        run: |
          lipo -info build/BreakTime.app/Contents/MacOS/BreakTime
          lipo -info build/BreakTime.app/Contents/MacOS/BreakTime | grep -q arm64
          lipo -info build/BreakTime.app/Contents/MacOS/BreakTime | grep -q x86_64

      - name: Zip app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/BreakTime.app "dist/BreakTime_${GITHUB_REF_NAME}_universal.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/BreakTime_${GITHUB_REF_NAME}_universal.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
